<!DOCTYPE html>
<html lang="ja">
<head><!-- Google tag (gtag.js) -->

<script>

  gtag('js', new Date());

  gtag('config', 'G-BMFDEZ5Y3V');

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ハロウィンの館 2026 ／ 会期の記録</title>
<link rel="preload" as="image" href="lobby.jpg">
<style>
/* ============================================================
   ハロウィンの館 2026 ― 会期の記録（横スワイプ）
   URLは lobby.html のままです
   ============================================================ */
:root{
  --night:#0E0B12;
  --cream:#F4ECDD;
  --mute:#C3B39C;
  --dim:#9A8C78;
  --gold:rgba(214,176,112,.5);
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","HGS明朝E",Georgia,serif;
  --gothic:"Hiragino Sans","Yu Gothic","YuGothic","Helvetica Neue",Arial,sans-serif;
  --ease:cubic-bezier(.65,.05,.36,1);
  /* 広間の絵の大きさ（入口と同じ決め方） */
  --scene-w:min(max(100vw, 60svh), 80svh);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--night)}
body{font-family:var(--gothic);color:var(--cream);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--cream);outline-offset:3px}

/* ---------- 背景（広間の絵） ---------- */
.haze{position:fixed;inset:-6%;z-index:0;
  background:url(lobby.jpg) center/cover no-repeat;
  filter:blur(28px) brightness(.46) saturate(1.02)}

.art{position:fixed;left:50%;top:50%;z-index:1;
  width:var(--scene-w);aspect-ratio:1122/1402;translate:-50% -50%;
  opacity:0;animation:fade 1.6s ease .1s forwards;
  -webkit-mask-image:
    linear-gradient(180deg,transparent 0,#000 7%,#000 93%,transparent 100%),
    linear-gradient(90deg,transparent 0,#000 5%,#000 95%,transparent 100%);
  -webkit-mask-composite:source-in;
          mask-image:
    linear-gradient(180deg,transparent 0,#000 7%,#000 93%,transparent 100%),
    linear-gradient(90deg,transparent 0,#000 5%,#000 95%,transparent 100%);
          mask-composite:intersect}
@keyframes fade{to{opacity:1}}
.art img{display:block;width:100%;height:100%;object-fit:cover;
  -webkit-user-select:none;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}

.veil{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(10,8,12,.42) 0%,transparent 22%),
    linear-gradient(0deg,rgba(10,8,12,.5) 0%,transparent 24%)}

/* ---------- 横に並ぶ ---------- */
.strip{
  position:relative;z-index:3;
  display:flex;height:100svh;
  overflow-x:auto;overflow-y:hidden;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.strip::-webkit-scrollbar{display:none}
.panel{
  flex:0 0 100%;scroll-snap-align:center;
  display:flex;align-items:center;justify-content:center;
  padding:calc(44px + env(safe-area-inset-top)) clamp(22px,7vw,60px)
          calc(76px + env(safe-area-inset-bottom));
}
.inner{position:relative;width:min(560px,100%);text-align:center;
  opacity:0;animation:rise 1.1s var(--ease) .2s forwards}
/* 文字の後ろだけ、そっと暗くする（絵は周りに残ります） */
.inner::before{content:"";position:absolute;z-index:-1;
  inset:-20% -16%;
  background:radial-gradient(closest-side,
    rgba(10,8,12,.93) 0%,rgba(10,8,12,.89) 56%,
    rgba(10,8,12,.58) 84%,transparent 100%)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- 表紙 ---------- */
.mark{font-family:var(--mincho);font-size:clamp(10px,2.6vw,11.5px);
  letter-spacing:.42em;text-indent:.42em;color:var(--dim);margin-bottom:18px}
h1{font-family:var(--mincho);font-weight:400;
  font-size:clamp(24px,6.6vw,34px);letter-spacing:.15em;text-indent:.15em;line-height:1.5}
.sub{font-family:var(--mincho);font-size:clamp(12px,3.2vw,14px);
  letter-spacing:.3em;text-indent:.3em;color:var(--mute);margin-top:14px}
.span{font-family:var(--mincho);font-size:clamp(11px,2.9vw,12.5px);
  letter-spacing:.2em;color:var(--dim);margin-top:10px}
.lead{font-family:var(--mincho);font-size:clamp(12.5px,3.3vw,13.5px);
  line-height:2.1;color:var(--mute);margin-top:34px}
.hint{font-family:var(--mincho);font-size:11px;letter-spacing:.24em;
  color:var(--dim);margin-top:40px;opacity:.9}

/* ---------- 見出し ---------- */
.sec-title{display:flex;align-items:center;gap:14px;
  font-family:var(--mincho);font-size:clamp(11.5px,3vw,12.5px);
  letter-spacing:.26em;color:var(--mute);margin-bottom:30px;white-space:nowrap}
.sec-title::before,.sec-title::after{content:"";flex:1;height:1px;background:var(--gold);opacity:.45}
.sec-title .n{font-size:.85em;color:var(--dim);letter-spacing:.1em}

ul{list-style:none}
.w{display:inline-block}

/* お部屋をかまえてくださった方 */
.rooms li{border-bottom:1px solid rgba(214,176,112,.14)}
.rooms li:first-child{border-top:1px solid rgba(214,176,112,.14)}
.rooms a{display:block}
.rooms .row{display:block;padding:16px 4px;transition:background .25s}
.rooms a:hover .row{background:rgba(214,176,112,.07)}
.rooms .nm{font-family:var(--mincho);font-size:clamp(14.5px,4vw,16.5px);
  letter-spacing:.08em;line-height:1.5}
.rooms .tt{font-family:var(--mincho);font-size:clamp(11.5px,3vw,12.5px);
  color:var(--dim);margin-top:6px;line-height:1.6}
.rooms a .nm::after{content:"　›";color:var(--gold);font-size:.85em}

/* 作品をお寄せくださった方 */
.guests{display:flex;flex-wrap:wrap;justify-content:center;gap:14px 26px}
.guests li{font-family:var(--mincho);font-size:clamp(13.5px,3.6vw,15px);
  letter-spacing:.08em;line-height:1.7}

/* ---------- 結び ---------- */
.close{font-family:var(--mincho);font-size:clamp(13px,3.5vw,14.5px);
  line-height:2.2;color:var(--cream)}
.back{margin-top:40px}
.back a{display:inline-block;font-family:var(--mincho);font-size:11.5px;
  letter-spacing:.3em;text-indent:.3em;color:var(--mute);
  padding:13px 28px;border:1px solid rgba(214,176,112,.3);
  transition:color .3s,border-color .3s,background .3s}
.back a:hover{color:var(--cream);border-color:rgba(244,236,221,.5);
  background:rgba(214,176,112,.08)}

/* ---------- 下のしるし ---------- */
.dots{position:fixed;left:0;right:0;z-index:5;
  bottom:calc(26px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;gap:9px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:50%;
  background:rgba(244,236,221,.28);transition:background .3s,transform .3s}
.dots i.on{background:var(--cream);transform:scale(1.25)}

/* ---------- パソコンの矢印 ---------- */
.sw{position:fixed;top:50%;translate:0 -50%;z-index:6;
  width:46px;height:46px;border-radius:50%;
  background:rgba(22,18,24,.55);border:1px solid rgba(255,255,255,.42);
  color:#FBFBF9;font-size:19px;line-height:1;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;
  transition:opacity .3s,background .3s}
.sw:hover{background:rgba(214,176,112,.3)}
.sw[hidden]{display:none}
#swl{left:14px}
#swr{right:14px}
@media (hover:none){.sw{display:none !important}}

@media (prefers-reduced-motion:reduce){
  .inner{animation:none;opacity:1}
  .strip{scroll-behavior:auto}
}
</style>
</head>
<body>

<div class="haze" aria-hidden="true"></div>
<div class="art" aria-hidden="true"><img src="lobby.jpg" alt="" draggable="false"></div>
<div class="veil" aria-hidden="true"></div>

<div class="strip" id="strip"></div>

<div class="dots" id="dots" aria-hidden="true"></div>
<button class="sw" id="swl" aria-label="前へ">‹</button>
<button class="sw" id="swr" aria-label="次へ">›</button>

<script>
/* ============================================================
   ★ ここだけ書き換えてください ★
   ============================================================ */

/* 1枚に並べる、お部屋の数（スマホで読みやすいのは 4 か 5 です） */
const PER_PAGE = 5;

/* 表紙の、ひとこと（空にすると出ません） */
const LEAD = "2026年10月12日から31日まで、オンラインで開いた合同展の記録です。";

/* いちばん最後の、結びの言葉 */
const CLOSING = [
  "ご参加くださったみなさま、ご来館くださったみなさま、",
  "ありがとうございました。"
];

/* ------------------------------------------------------------
   お部屋をかまえてくださった方
   url を "" にすると、お名前だけになります（展示を閉じた方など）
   ------------------------------------------------------------ */
const ROOMS = [
  { name:"Lina",                     title:"Halloween Magical Night",                    url:"https://lina-ai-works.github.io/halloween-magicalnight/" },
  { name:"Proto",                    title:"［P.］",                                      url:"https://pro0000-sys.github.io/Protoon/" },
  { name:"Ozmo",                     title:"Halloween Party Night",                      url:"https://ozmoaiart-crypto.github.io/halloween/" },
  { name:"kirara",                   title:"♡ Happy Halloween ♡",                        url:"https://roseribbon-eng.github.io/kirararoom-halloweennight2026/" },
  { name:"はなゆめアート & ノアール",   title:"Trick or Dream",                             url:"https://hanayumeart2525-a11y.github.io/Halloween/" },
  { name:"HIROMI",                   title:"Sora & Lily Halloween Night",                url:"https://hiromi-sl.github.io/Sora-Lily-Halloween-Nig/" },
  { name:"Ran",                      title:"Halloween Night -不思議な夜の物語-",           url:"https://ran-aiartist.github.io/Online-Halloween/" },
  { name:"澄川 零",                   title:"黒猫と夜闇の散歩",                            url:"https://rei-sumikawa.github.io/Halloween-nightmare/" },
  { name:"Harumi",                   title:"Halloween～魔法のお菓子の館～",                url:"https://aquamarine-33333.github.io/harumi-halloween-art/" },
  { name:"HATSUMI",                  title:"Welcome to the Other Side -Happy Halloween-", url:"https://hatsumi-seah.github.io/Halloweenart/" }
];

/* ------------------------------------------------------------
   作品をお寄せくださった方（GUEST ROOM 1・2 のみなさん）
   お名前だけを、" " で囲んで、, で区切って並べてください
   例： const GUESTS = ["桜華", "さくら", "みなみ"];
   空のままだと、この1枚は出ません
   ------------------------------------------------------------ */
const GUESTS = ["桜華", "mike（ミケ）", "ＴＯＭＯＥ", "マリーちゃんのお店 まり", "ぱも", "Cere 🍒", "Aoi", "toroko", "みこ", "翠 ── sui_anthurium", "Reina", 
];

/* ============================================================
   ここから下は触らなくて大丈夫です
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s)
  .replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function line(t){
  const parts = String(t).split('、');
  return parts.map(function(s, i){
    return '<span class="w">' + esc(s + (i < parts.length - 1 ? '、' : '')) + '</span>';
  }).join('');
}

const rooms  = (ROOMS  || []).filter(r => r && r.name);
const guests = (GUESTS || []).filter(n => n && String(n).trim());

/* --- 1枚ずつ組み立てる --- */
const pages = [];

/* 表紙 */
pages.push(
  '<div class="mark">HALLOWEEN MANSION 2026</div>' +
  '<h1>ハロウィンの館</h1>' +
  '<div class="sub">会期の記録</div>' +
  '<div class="span">2026.10.12 — 10.31</div>' +
  (LEAD ? '<p class="lead">' + line(LEAD) + '</p>' : '') +
  '<div class="hint">横にスワイプしてご覧ください</div>'
);

/* お部屋 */
const chunks = [];
for (let i = 0; i < rooms.length; i += PER_PAGE) chunks.push(rooms.slice(i, i + PER_PAGE));
chunks.forEach(function(group, n){
  const items = group.map(function(r){
    const inner =
      '<div class="row">' +
        '<div class="nm">' + esc(r.name) + '</div>' +
        (r.title ? '<div class="tt">' + esc(r.title) + '</div>' : '') +
      '</div>';
    return '<li>' + (r.url
      ? '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + inner + '</a>'
      : inner) + '</li>';
  }).join('');
  pages.push(
    '<div class="sec-title">お部屋をかまえてくださった方' +
      (chunks.length > 1 ? '<span class="n">' + (n + 1) + ' / ' + chunks.length + '</span>' : '') +
    '</div>' +
    '<ul class="rooms">' + items + '</ul>'
  );
});

/* 作品をお寄せくださった方 */
if (guests.length){
  pages.push(
    '<div class="sec-title">作品をお寄せくださった方</div>' +
    '<ul class="guests">' + guests.map(n => '<li>' + esc(n) + '</li>').join('') + '</ul>'
  );
}

/* 結び */
pages.push(
  '<p class="close">' + (CLOSING || []).map(t => line(t)).join('<br>') + '</p>' +
  '<div class="back"><a href="index.html">入口へ</a></div>'
);

$('#strip').innerHTML = pages
  .map(h => '<section class="panel"><div class="inner">' + h + '</div></section>').join('');
$('#dots').innerHTML = pages.map(() => '<i></i>').join('');

/* --- 位置のしるしと、矢印 --- */
const strip = $('#strip');
const dots  = [].slice.call(document.querySelectorAll('.dots i'));
let at = 0;

function mark(){
  const i = Math.round(strip.scrollLeft / strip.clientWidth);
  if (i !== at){ at = i; }
  dots.forEach((d, n) => d.classList.toggle('on', n === at));
  $('#swl').hidden = (at <= 0);
  $('#swr').hidden = (at >= pages.length - 1);
}
strip.addEventListener('scroll', () => { window.requestAnimationFrame(mark); }, { passive:true });
window.addEventListener('resize', mark);
mark();

function slide(dir){
  strip.scrollBy({ left: dir * strip.clientWidth, behavior:'smooth' });
}
$('#swl').addEventListener('click', () => slide(-1));
$('#swr').addEventListener('click', () => slide(1));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') slide(1);
  if (e.key === 'ArrowLeft')  slide(-1);
});

/* 長押し・右クリックでの保存を抑止 */
document.addEventListener('contextmenu', e => {
  if (e.target.closest('.art, .haze')) e.preventDefault();
});

/* どのお部屋が開かれたかを記録します（GA4） */
document.addEventListener('click', e => {
  const a = e.target.closest('.rooms a');
  if (!a || typeof gtag !== 'function') return;
  const nm = a.querySelector('.nm');
  gtag('event', 'record_open', {
    exhibit_name: nm ? nm.textContent.replace('　›', '').trim() : '',
    exhibit_url: a.getAttribute('href')
  });
});
</script>
</body>
</html>
