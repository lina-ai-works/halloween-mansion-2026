<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HALLOWEEN EXHIBITION</title>
<link rel="preload" as="image" href="gate.jpg">
<link rel="prefetch" href="lobby.html">
<style>
/* ============================================================
   合同展の入口（門の絵 → ENTER → ロビー）
   ============================================================ */
:root{
  --night:#0E0B12;          /* 暗転の色（展示室の到着と同じ） */
  --cream:#F4ECDD;          /* タイトルの色 */
  --mute:#C9BBA6;           /* 小さい文字 */
  --ember:rgba(255,160,70,.55);   /* かぼちゃの灯り */
  --ease:cubic-bezier(.65,.05,.36,1);
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","HGS明朝E",Georgia,serif;
  --gothic:"Hiragino Sans","Yu Gothic","YuGothic","Helvetica Neue",Arial,sans-serif;
  /* 絵の大きさ：スマホでは門の柱が切れない幅、横長の画面では縦がぴったり収まる大きさ */
  --scene-w:min(max(100vw, 60svh), 80svh);
  /* 洋館の扉の位置（絵の中の割合） */
  --door-x:51.5%;
  --door-y:58%;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--night)}
body{font-family:var(--gothic);color:var(--cream);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--cream);outline-offset:4px}

/* ---------- 背景（同じ絵をぼかして、余白を埋める） ---------- */
.haze{
  position:fixed;inset:-6%;z-index:0;
  background:url(gate.jpg) center/cover no-repeat;
  filter:blur(28px) brightness(.5) saturate(1.1);
  transition:opacity 1.2s ease;
}

/* ---------- 門の絵 ---------- */
.scene{
  position:fixed;left:50%;top:50%;z-index:1;
  width:var(--scene-w);aspect-ratio:1122/1402;
  translate:-50% -50%;
  transform-origin:var(--door-x) var(--door-y);
  opacity:0;
  animation:arrive 1.8s ease .1s forwards;
  -webkit-mask-image:
    linear-gradient(180deg,transparent 0,#000 7%,#000 93%,transparent 100%),
    linear-gradient(90deg,transparent 0,#000 5%,#000 95%,transparent 100%);
  -webkit-mask-composite:source-in;
          mask-image:
    linear-gradient(180deg,transparent 0,#000 7%,#000 93%,transparent 100%),
    linear-gradient(90deg,transparent 0,#000 5%,#000 95%,transparent 100%);
          mask-composite:intersect;
}
@keyframes arrive{from{opacity:0;transform:scale(1.04)}to{opacity:1;transform:scale(1)}}
.scene img{display:block;width:100%;height:100%;object-fit:cover;
  -webkit-user-select:none;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}

/* かぼちゃと窓の灯りを、ほんの少しゆらす */
.glow{position:absolute;border-radius:50%;pointer-events:none;
  mix-blend-mode:screen;opacity:.0;
  background:radial-gradient(closest-side,var(--ember),transparent);
  animation:flicker 3.4s ease-in-out infinite}
@keyframes flicker{
  0%,100%{opacity:.35} 18%{opacity:.62} 31%{opacity:.42}
  52%{opacity:.7} 68%{opacity:.4} 84%{opacity:.58}
}
.glow.window{background:radial-gradient(closest-side,rgba(255,236,200,.5),transparent);
  animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:.6}}

/* 扉のところも押せるようにする */
.door-hit{position:absolute;left:calc(var(--door-x) - 6%);top:calc(var(--door-y) - 7%);
  width:12%;height:13%;border-radius:40% 40% 4px 4px;cursor:pointer}

/* ---------- 文字 ---------- */
.shade{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(10,8,12,.72) 0%,rgba(10,8,12,.28) 22%,transparent 38%),
    linear-gradient(0deg,rgba(10,8,12,.78) 0%,rgba(10,8,12,.3) 20%,transparent 36%);
  transition:opacity .8s ease}

.head{
  position:fixed;left:0;right:0;z-index:3;
  top:calc(clamp(26px,6svh,64px) + env(safe-area-inset-top));
  display:flex;flex-direction:column;align-items:center;gap:10px;
  padding:0 20px;text-align:center;
  opacity:0;animation:rise 1.4s var(--ease) .7s forwards;
  text-shadow:0 2px 16px rgba(0,0,0,.6);
}
.eyebrow{font-family:var(--mincho);font-size:clamp(10px,2.6vw,12px);
  letter-spacing:.46em;text-indent:.46em;color:var(--mute)}
.title{font-family:var(--mincho);font-weight:400;
  font-size:clamp(26px,7.2vw,46px);letter-spacing:.18em;text-indent:.18em;line-height:1.45}
.period{font-family:var(--mincho);font-size:clamp(11px,3vw,13.5px);
  letter-spacing:.28em;text-indent:.28em;color:var(--mute)}

.foot{
  position:fixed;left:0;right:0;z-index:3;
  bottom:calc(clamp(28px,7svh,70px) + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:14px;
  opacity:0;animation:rise 1.4s var(--ease) 1.3s forwards;
}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.enter{
  font-family:var(--mincho);font-size:14px;letter-spacing:.5em;text-indent:.5em;
  color:var(--cream);padding:15px 38px;
  border:1px solid rgba(244,236,221,.42);
  background:rgba(14,11,18,.34);backdrop-filter:blur(3px);
  transition:background .35s,border-color .35s,letter-spacing .35s;
}
.enter:hover{background:rgba(255,160,70,.16);border-color:var(--cream)}
.note{font-family:var(--mincho);font-size:11px;letter-spacing:.2em;color:var(--mute);
  text-shadow:0 1px 10px rgba(0,0,0,.7)}

/* ---------- 入っていく ---------- */
#dark{position:fixed;inset:0;z-index:10;background:var(--night);
  opacity:0;pointer-events:none;transition:opacity .9s ease .75s}
body.going #dark{opacity:1}
body.going .scene{
  animation:none;opacity:1;
  transform:scale(3.4);
  transition:transform 1.7s cubic-bezier(.55,0,.8,.3);
}
body.going .haze{opacity:0}
body.going .head,body.going .foot,body.going .shade{
  animation:none;opacity:0;transition:opacity .5s ease}

@media (prefers-reduced-motion:reduce){
  .scene,.head,.foot{animation:none;opacity:1}
  .glow{animation:none;opacity:.45}
  body.going .scene{transform:none;transition:none}
  #dark{transition-delay:0s}
}
</style>
</head>
<body>

<div class="haze" aria-hidden="true"></div>

<div class="scene" id="scene">
  <img src="gate.jpg" alt="門の奥に、灯りのともった洋館が見える" draggable="false">
  <!-- かぼちゃの灯り（左から） -->
  <span class="glow" style="left:-1%;top:70%;width:20%;height:16%;animation-delay:-.4s"></span>
  <span class="glow" style="left:20%;top:66.3%;width:10%;height:8%;animation-delay:-1.9s"></span>
  <span class="glow" style="left:31.5%;top:63.5%;width:10%;height:8%;animation-delay:-2.6s"></span>
  <span class="glow" style="left:37%;top:63.2%;width:8%;height:6.4%;animation-delay:-1.4s"></span>
  <span class="glow" style="left:56.6%;top:62.8%;width:8%;height:6.4%;animation-delay:-1.1s"></span>
  <span class="glow" style="left:67%;top:67%;width:10%;height:8%;animation-delay:-3s"></span>
  <span class="glow" style="left:72.5%;top:65.5%;width:10%;height:8%;animation-delay:-2.2s"></span>
  <span class="glow" style="left:80%;top:70.3%;width:20%;height:16%;animation-delay:-.9s"></span>
  <span class="glow" style="left:88%;top:88.4%;width:13%;height:10%;animation-delay:-1.6s"></span>
  <!-- 門灯 -->
  <span class="glow" style="left:20.2%;top:53.7%;width:8%;height:6%;animation-delay:-2.4s"></span>
  <span class="glow" style="left:72.2%;top:53.7%;width:8%;height:6%;animation-delay:-.7s"></span>
  <!-- 窓と扉の灯り -->
  <span class="glow window" style="left:42%;top:49.8%;width:19%;height:16%"></span>
  <span class="glow window" style="left:45.5%;top:40%;width:12%;height:12%;animation-delay:-2s"></span>
  <span class="glow window" style="left:35.4%;top:51%;width:12%;height:12%;animation-delay:-3.2s"></span>
  <span class="glow window" style="left:56.4%;top:51%;width:12%;height:12%;animation-delay:-1.2s"></span>
  <button class="door-hit" id="door" aria-label="洋館に入る"></button>
</div>

<div class="shade" aria-hidden="true"></div>

<header class="head">
  <div class="eyebrow" id="eyebrow"></div>
  <h1 class="title" id="title"></h1>
  <div class="period" id="period"></div>
</header>

<div class="foot">
  <button class="enter" id="enter">ENTER</button>
  <div class="note" id="note"></div>
</div>

<div id="dark"></div>

<script>
/* ============================================================
   ★ ここだけ書き換えてください ★
   ============================================================ */
const EVENT = {
  eyebrow: "みんなでつくる",
  title:   "ハロウィンの館",
  period:  "2026.10.12 — 10.31",     // 会期
  note:    "門をくぐって、洋館の中へ",   // ENTERの下の小さな文字（空でもOK）
  lobby:   "lobby.html"                 // ロビーのファイル名（同じ場所に置きます）
};

/* ============================================================
   ここから下は触らなくて大丈夫です
   ============================================================ */
const $ = s => document.querySelector(s);
$('#eyebrow').textContent = EVENT.eyebrow;
$('#title').textContent   = EVENT.title;
$('#period').textContent  = EVENT.period;
$('#note').textContent    = EVENT.note;
if (!EVENT.period) $('#period').remove();
if (!EVENT.note) $('#note').remove();
document.title = EVENT.title;

let going = false;
function enter(){
  if (going) return;
  going = true;
  document.body.classList.add('going');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(() => { location.href = EVENT.lobby; }, reduce ? 700 : 1700);
}
$('#enter').addEventListener('click', enter);
$('#door').addEventListener('click', enter);
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.activeElement === document.body) enter();
});

/* ロビーから「戻る」で帰ってきたとき、暗いままにならないようにする */
window.addEventListener('pageshow', e => {
  if (e.persisted){ going = false; document.body.classList.remove('going'); }
});

/* 長押し・右クリックでの保存を抑止 */
document.addEventListener('contextmenu', e => {
  if (e.target.closest('.scene, .haze')) e.preventDefault();
});
</script>
</body>
</html>
