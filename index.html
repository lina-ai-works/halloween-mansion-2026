<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ハロウィンの館 2026</title>
<link rel="preload" as="image" href="gate.jpg">
<link rel="prefetch" href="lobby.html">
<style>
/* ============================================================
   ハロウィンの館 ― 閉館後の入口
   絵はそのまま。文面とボタンだけ、日付で切り替わります。
   ============================================================ */
:root{
  --night:#0E0B12;
  --cream:#F4ECDD;
  --mute:#C9BBA6;
  --gold:rgba(214,176,112,.5);
  --ember:rgba(255,160,70,.55);
  --ease:cubic-bezier(.65,.05,.36,1);
  --mincho:"Hiragino Mincho ProN","Yu Mincho","YuMincho","HGS明朝E",Georgia,serif;
  --gothic:"Hiragino Sans","Yu Gothic","YuGothic","Helvetica Neue",Arial,sans-serif;
  --scene-w:min(max(100vw, 60svh), 80svh);
  --door-x:51.5%;
  --door-y:58%;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;background:var(--night)}
body{font-family:var(--gothic);color:var(--cream);-webkit-font-smoothing:antialiased;
  overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--cream);outline-offset:4px}

/* ---------- 背景（同じ絵をぼかして、余白を埋める） ---------- */
.haze{
  position:fixed;inset:-6%;z-index:0;
  background:url(gate.jpg) center/cover no-repeat;
  filter:blur(28px) brightness(.42) saturate(1.05);
}

/* ---------- 門の絵 ---------- */
.scene{
  position:fixed;left:50%;top:50%;z-index:1;
  width:var(--scene-w);aspect-ratio:1122/1402;
  translate:-50% -50%;
  opacity:0;
  animation:arrive 1.8s ease .1s forwards;
  -webkit-mask-image:
    linear-gradient(180deg,transparent 0,#000 7%,#000 93%,transparent 100%),
    linear-gradient(90deg,transparent 0,#000 5%,#000 95%,transparent 100%);
  -webkit-mask-composite:source-in;
          mask-image:
    linear-gradient(180deg,transparent 0,#000 7%,#000 93%,transparent 100%),
    linear-gradient(90deg,transparent 0,#000 5%,#000 95%,transparent 100%);
          mask-composite:intersect;
}
@keyframes arrive{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
.scene img{display:block;width:100%;height:100%;object-fit:cover;
  -webkit-user-select:none;user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}

/* かぼちゃと窓の灯りを、ほんの少しゆらす */
.glow{position:absolute;border-radius:50%;pointer-events:none;
  mix-blend-mode:screen;opacity:0;
  background:radial-gradient(closest-side,var(--ember),transparent);
  animation:flicker 3.4s ease-in-out infinite}
@keyframes flicker{
  0%,100%{opacity:.35} 18%{opacity:.62} 31%{opacity:.42}
  52%{opacity:.7} 68%{opacity:.4} 84%{opacity:.58}
}
.glow.window{background:radial-gradient(closest-side,rgba(255,236,200,.5),transparent);
  animation:breathe 6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.25}50%{opacity:.6}}

/* 扉を押すと、記録ページへ */
.door-hit{position:absolute;left:calc(var(--door-x) - 6%);top:calc(var(--door-y) - 7%);
  width:12%;height:13%;border-radius:40% 40% 4px 4px;cursor:pointer}

/* ---------- 画面全体を少し落とす ---------- */
.shade{position:fixed;inset:0;z-index:2;pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 50%,rgba(10,8,12,.18) 0%,rgba(10,8,12,.62) 100%),
    linear-gradient(180deg,rgba(10,8,12,.34) 0%,transparent 26%),
    linear-gradient(0deg,rgba(10,8,12,.6) 0%,transparent 28%);
}

/* ---------- お知らせの札 ---------- */
.wrap{
  position:relative;z-index:3;
  min-height:100svh;
  display:flex;align-items:center;justify-content:center;
  padding:calc(28px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
}
.card{
  width:min(540px,100%);
  padding:clamp(26px,6vw,40px) clamp(20px,5vw,38px);
  background:rgba(12,9,15,.72);
  border:1px solid rgba(214,176,112,.28);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  box-shadow:0 18px 60px rgba(0,0,0,.5);
  text-align:center;
  opacity:0;animation:rise 1.3s var(--ease) .6s forwards;
}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.mark{font-family:var(--mincho);font-size:clamp(10px,2.6vw,11.5px);
  letter-spacing:.42em;text-indent:.42em;color:var(--mute);margin-bottom:14px}
.name{font-family:var(--mincho);font-weight:400;
  font-size:clamp(21px,5.6vw,28px);letter-spacing:.16em;text-indent:.16em;
  line-height:1.5;margin-bottom:6px}
.span{font-family:var(--mincho);font-size:clamp(10.5px,2.8vw,12px);
  letter-spacing:.2em;color:var(--mute);margin-bottom:26px}

.msg{font-family:var(--mincho);font-size:clamp(13px,3.5vw,14.5px);
  line-height:2.1;color:var(--cream)}
.msg p + p{margin-top:.4em}

/* 文を「、」のところで折り返す（スマホで1文字だけ落ちないように） */
.w{display:inline-block}
.gap{height:24px}

.btns{display:flex;flex-direction:column;align-items:center;gap:11px;margin-top:26px}
.btn{
  display:inline-block;
  font-family:var(--mincho);font-size:13px;letter-spacing:.36em;text-indent:.36em;
  padding:14px 30px;min-width:min(260px,100%);
  border:1px solid rgba(244,236,221,.4);
  background:rgba(14,11,18,.4);
  transition:background .3s,border-color .3s;
}
.btn:hover{background:rgba(255,160,70,.14);border-color:var(--cream)}
.btn.lead{border-color:rgba(214,176,112,.66);background:rgba(214,176,112,.1)}
.btn.lead:hover{background:rgba(255,160,70,.2)}

.rule{display:flex;align-items:center;gap:14px;margin:30px 0 20px;
  font-family:var(--mincho);font-size:11px;letter-spacing:.3em;color:var(--mute)}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:var(--gold);opacity:.5}

.next-title{font-family:var(--mincho);font-size:clamp(15px,4.2vw,18px);
  letter-spacing:.1em;line-height:1.6;margin-bottom:8px}
.next-span{font-family:var(--mincho);font-size:clamp(11px,3vw,12.5px);
  letter-spacing:.14em;color:var(--mute);margin-bottom:18px}
.next-body{font-family:var(--mincho);font-size:clamp(12.5px,3.3vw,13.5px);
  line-height:2.05;color:var(--cream);opacity:.94}
.next-body .open{margin-top:.9em;color:var(--mute)}

@media (prefers-reduced-motion:reduce){
  .scene,.card{animation:none;opacity:1}
  .glow{animation:none;opacity:.45}
}
</style>
</head>
<body>

<div class="haze" aria-hidden="true"></div>

<div class="scene" id="scene" aria-hidden="true">
  <img src="gate.jpg" alt="" draggable="false">
  <!-- かぼちゃの灯り -->
  <span class="glow" style="left:-1%;top:70%;width:20%;height:16%;animation-delay:-.4s"></span>
  <span class="glow" style="left:20%;top:66.3%;width:10%;height:8%;animation-delay:-1.9s"></span>
  <span class="glow" style="left:31.5%;top:63.5%;width:10%;height:8%;animation-delay:-2.6s"></span>
  <span class="glow" style="left:37%;top:63.2%;width:8%;height:6.4%;animation-delay:-1.4s"></span>
  <span class="glow" style="left:56.6%;top:62.8%;width:8%;height:6.4%;animation-delay:-1.1s"></span>
  <span class="glow" style="left:67%;top:67%;width:10%;height:8%;animation-delay:-3s"></span>
  <span class="glow" style="left:72.5%;top:65.5%;width:10%;height:8%;animation-delay:-2.2s"></span>
  <span class="glow" style="left:80%;top:70.3%;width:20%;height:16%;animation-delay:-.9s"></span>
  <span class="glow" style="left:88%;top:88.4%;width:13%;height:10%;animation-delay:-1.6s"></span>
  <!-- 門灯 -->
  <span class="glow" style="left:20.2%;top:53.7%;width:8%;height:6%;animation-delay:-2.4s"></span>
  <span class="glow" style="left:72.2%;top:53.7%;width:8%;height:6%;animation-delay:-.7s"></span>
  <!-- 窓と扉の灯り -->
  <span class="glow window" style="left:42%;top:49.8%;width:19%;height:16%"></span>
  <span class="glow window" style="left:45.5%;top:40%;width:12%;height:12%;animation-delay:-2s"></span>
  <span class="glow window" style="left:35.4%;top:51%;width:12%;height:12%;animation-delay:-3.2s"></span>
  <span class="glow window" style="left:56.4%;top:51%;width:12%;height:12%;animation-delay:-1.2s"></span>
  <a class="door-hit" href="lobby.html" aria-label="会期の記録を見る"></a>
</div>

<div class="shade" aria-hidden="true"></div>

<div class="wrap">
  <main class="card" id="card"></main>
</div>

<script>
/* ============================================================
   ★ ここだけ書き換えてください ★
   ============================================================ */

/* ART QUEST のURL。決まったら入れてください。
   空のままだと「街へ行く」のボタンは出ません。 */
const ARTQUEST_URL = "";

/* 文面が切り替わる日（この日の朝から、下の【11月14日から】になります） */
const SWITCH_DATE = "2026-11-14";

/* 会期の記録ページ */
const RECORD_URL = "lobby.html";

/* ============================================================
   ここから下は触らなくて大丈夫です
   ============================================================ */

/* 切り替わる前（〜11月13日） */
const BEFORE = {
  message: [
    "ハロウィンの館は、10月31日で会期を終えました。",
    "たくさんのご来館、ありがとうございました。"
  ],
  next: {
    title: "ART QUEST　～秘密の鍵を探して～",
    span:  "2026年11月14日（土）から",
    body: [
      "秋の不思議な街に、作家たちがお部屋をかまえます。",
      "それぞれのお部屋のどこかに、鍵がひとつ。",
      "すべて集めると、広場の宝箱が開きます。"
    ],
    open: "11月14日、開門します。"
  },
  town: false
};

/* 切り替わったあと（11月14日〜） */
const AFTER = {
  message: [
    "ハロウィンの館は閉館しました。",
    "ご来館ありがとうございました。"
  ],
  next: {
    title: "ART QUEST　～秘密の鍵を探して～",
    span:  "開催中",
    body: [
      "いま、秋の街で鍵さがしをしています。"
    ],
    open: ""
  },
  nextFirst: true,   /* お知らせをボタンより先に出す */
  town: true
};

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* 今日が切り替えの日を過ぎているか（端末の日付で見ます）
   ?after を付けて開くと、11月14日からの画面を先に確認できます */
function isAfter(){
  const q = location.search;
  if (/[?&]after/.test(q)) return true;
  if (/[?&]before/.test(q)) return false;
  const n = new Date();
  const today = n.getFullYear() + '-' +
                String(n.getMonth() + 1).padStart(2, '0') + '-' +
                String(n.getDate()).padStart(2, '0');
  return today >= SWITCH_DATE;
}

/* 「、」のところで切って、1文字だけ次の行に落ちないようにします */
function line(t){
  const parts = String(t).split('、');
  return parts.map(function(s, i){
    return '<span class="w">' + esc(s + (i < parts.length - 1 ? '、' : '')) + '</span>';
  }).join('');
}
const para = arr => (arr || []).map(t => '<p>' + line(t) + '</p>').join('');

function nextBlock(n, divider){
  const h = [];
  if (divider) h.push('<div class="rule">次のイベント</div>');
  else h.push('<div class="gap"></div>');
  h.push('<div class="next-title">' + esc(n.title) + '</div>');
  h.push('<div class="next-span">' + esc(n.span) + '</div>');
  h.push('<div class="next-body">' + para(n.body) +
    (n.open ? '<p class="open">' + line(n.open) + '</p>' : '') + '</div>');
  return h.join('');
}

function render(){
  const v = isAfter() ? AFTER : BEFORE;
  const town = v.town && ARTQUEST_URL;
  const h = [];

  h.push('<div class="mark">HALLOWEEN MANSION 2026</div>');
  h.push('<h1 class="name">ハロウィンの館</h1>');
  h.push('<div class="span">2026.10.12 — 10.31</div>');

  h.push('<div class="msg">' + para(v.message) + '</div>');

  if (v.next && v.nextFirst) h.push(nextBlock(v.next, false));

  h.push('<div class="btns">');
  if (town){
    h.push('<a class="btn lead" href="' + esc(ARTQUEST_URL) + '">街へ行く</a>');
  }
  h.push('<a class="btn' + (town ? '' : ' lead') + '" href="' + esc(RECORD_URL) + '">会期の記録を見る</a>');
  h.push('</div>');

  if (v.next && !v.nextFirst) h.push(nextBlock(v.next, true));

  document.getElementById('card').innerHTML = h.join('');
}
render();

/* 長押し・右クリックでの保存を抑止 */
document.addEventListener('contextmenu', e => {
  if (e.target.closest('.scene, .haze')) e.preventDefault();
});
</script>
</body>
</html>
